<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARTEMIS · Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="cockpit.css" />
  <!-- TODO(webgl-hero): optional future upgrade — see about.html for details -->
</head>
<body class="page cockpit" data-ai-state="idle">
  <!-- the audio-reactive orb fills the stage behind the HUD -->
  <div id="sceneStage" class="scene-stage" aria-hidden="true"></div>

  <!-- boot sequence overlay (removed after init; skipped under reduced motion) -->
  <div class="boot" id="boot" aria-hidden="true">
    <pre class="boot-lines" id="bootLines"></pre>
  </div>

  <!-- HUD frame dressing: corner brackets + radar sweep + scanlines -->
  <div class="hud-frame" aria-hidden="true">
    <i class="hud-corner tl"></i><i class="hud-corner tr"></i>
    <i class="hud-corner bl"></i><i class="hud-corner br"></i>
    <div class="hud-sweep"></div>
  </div>

  <!-- top status bar: real telemetry, no fake numbers -->
  <header class="hud-top" aria-label="System status">
    <div class="hud-brand">
      <span class="brand-dot"></span> ARTEMIS <span class="hud-os">OS</span>
    </div>
    <div class="hud-dots" id="hudDots" aria-label="Subsystem status">
      <span class="hud-dot" data-sys="brain" title="LLM">⬤ BRAIN</span>
      <span class="hud-dot" data-sys="voice" title="STT/TTS">⬤ VOICE</span>
      <span class="hud-dot" data-sys="web" title="Web search">⬤ WEB</span>
      <span class="hud-dot" data-sys="gmail" title="Gmail">⬤ MAIL</span>
    </div>
    <div class="hud-meta">
      <span class="hud-ttfw" id="hudTtfw" title="Time to first word, last turn">TTFW —</span>
      <span class="hud-clock" id="hudClock">--:--:--</span>
      <nav class="hud-links" aria-label="Pages">
        <a href="brain.html">BRAIN</a>
        <a href="about.html">ABOUT</a>
      </nav>
    </div>
  </header>

  <!-- left: live command console -->
  <aside class="hud-panel hud-left" aria-label="Command log">
    <div class="hud-panel-title">COMMAND LOG</div>
    <div class="hud-log" id="cmdLog" aria-live="polite"></div>
  </aside>

  <!-- right: context (sources, actions, confirmations) -->
  <aside class="hud-panel hud-right" aria-label="Context">
    <div class="hud-panel-title">CONTEXT</div>
    <div class="hud-cards" id="ctxCards"></div>
  </aside>

  <!-- bottom: controls + live waveform. Same ids the voice pipeline expects. -->
  <div class="dock" id="dock" data-state="expanded" aria-label="Artemis controls">
    <div class="dock-status" id="liveStatus">Say “Artemis”, or tap the mic to talk</div>
    <canvas class="hud-wave" id="hudWave" height="36" aria-hidden="true"></canvas>
    <div class="dock-row" id="dockBody">
      <button class="mic-orb" id="micToggle" aria-label="Talk to Artemis"><span>🎤</span></button>
      <div class="voice-bars" id="voiceBars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <button class="wake-toggle" id="wakeToggle">👂 WAKE WORD: OFF</button>
      <button class="wake-toggle" id="explainBtn" type="button">✨ WHAT CAN I DO?</button>
      <span class="dock-sep"></span>
      <label class="set-field">Voice
        <select id="voiceSelect">
          <option value="aura-2-thalia-en">Thalia</option>
          <option value="aura-2-andromeda-en">Andromeda</option>
          <option value="aura-2-vesta-en">Vesta</option>
          <option value="aura-2-helena-en">Helena</option>
          <option value="aura-2-apollo-en">Apollo</option>
          <option value="eleven:pFZP5JQG7iQjIQuC4Bku">Lily (British)</option>
          <option value="eleven:Xb7hH8MSUJpSbSDYk0k2">Alice (British)</option>
          <option value="aura-luna-en">Luna (older)</option>
        </select>
      </label>
      <label class="set-field">Tone
        <select id="toneSelect">
          <option value="professional">Professional (JARVIS)</option>
          <option value="friendly">Friendly</option>
          <option value="casual">Casual</option>
          <option value="funny">Funny</option>
          <option value="balanced">Balanced</option>
          <option value="blunt">Blunt</option>
        </select>
      </label>
    </div>
  </div>

  <script src="celebration.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="cockpit.js"></script>
</body>
</html>
